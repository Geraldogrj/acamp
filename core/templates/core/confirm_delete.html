{% extends "core/base.html" %}
{% block title %}Confirmar exclusão{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4">Excluir “{{ objeto }}”?</h1>
                <p class="text-secondary">Esta ação não pode ser desfeita.</p>
                <form method="post">
                    {% csrf_token %}
                    <button class="btn btn-danger" type="submit">Confirmar exclusão</button>
                    <a class="btn btn-outline-secondary" href="{{ cancel_href }}">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
